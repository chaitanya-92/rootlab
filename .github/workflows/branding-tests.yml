name: KernelSU branding configuration checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test all logo variants and identity configuration
        run: PYTHONPATH=tools python3 -m unittest discover -s tools -p 'test_*.py' -v
